<body>
  <div class="page">

      <button id="lang-de" type="button">DE</button>

    <div class="divider">&#10022; &#10022; &#10022;</div>

    <p class="note" data-i18n-html="note1"></p>

    <label for="name" data-i18n="label"></label>
    <input id="name" type="text" maxlength="40">
    <div id="timer">3:00</div>

    <div>

    <div>

      const saved = localStorage.getItem('guestbookLang');
      if (saved && TEXT[saved]) lang = saved;
    } catch (e) {}

    let statusKey = '';
    let recordedOnce = false;
    const t = key => TEXT[lang][key];

    function renderStatus() {
      const el = $('status');
      el.textContent = '';
      if (!statusKey) return;
      if (statusKey === 'thanks') {
        const b = document.createElement('b');
        b.textContent = t('thanks1');
        el.appendChild(b);
        const b2 = document.createElement('b');
        b2.textContent = t('thanks2');
        el.appendChild(b2);
      } else {
        el.textContent = t(statusKey);
      }
    }

    function setStatus(key) {
      statusKey = key;
      renderStatus();
    }

    function applyLang() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
      $('name').placeholder = t('placeholder');
      $('rec').textContent = recordedOnce ? t('recAgain') : t('rec');
      $('stop').textContent = t('stop');
      $('send').textContent = t('send');
      $('again').textContent = t('again');
      ['en', 'de', 'ms'].forEach(l => $('lang-' + l).classList.toggle('on', lang === l));
      renderStatus();
    }

    function chooseLang(l) {
      lang = l;
      try { localStorage.setItem('guestbookLang', l); } catch (e) {}
      applyLang();
    }
    ['en', 'de', 'ms'].forEach(l => { $('lang-' + l).onclick = () => chooseLang(l); });

    // ---------- Recording ----------
    function resetToStart(key) {
      $('player').style.display = 'none';
      $('send').style.display = 'none';
      $('again').style.display = 'none';
      $('rec').style.display = 'inline-block';
      $('timer').textContent = fmt(MAX_SECONDS);
      setStatus(key || '');
    }

    function pickMime() {
      const options = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
      for (const o of options) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(o)) return o;
      }
      return '';
    }

    $('rec').onclick = async () => {
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        setStatus('unsupported');
        return;
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        setStatus('mic');
        return;
      }
      mime = pickMime();
      recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      mime = recorder.mimeType || mime || 'audio/webm';
      chunks = [];
      recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        blob = new Blob(chunks, { type: mime });
        if (blob.size < 1000) {
          resetToStart('empty');
          return;
        }
        $('player').src = URL.createObjectURL(blob);
        $('player').style.display = 'inline-block';
        $('send').style.display = 'inline-block';
        $('again').style.display = 'inline-block';
        setStatus('listen');
      };
      recorder.start();
      left = MAX_SECONDS;
      $('timer').textContent = fmt(left);
      $('rec').style.display = 'none';
      $('stop').style.display = 'inline-block';
      setStatus('recording');
      tick = setInterval(() => {
        left--;
        $('timer').textContent = fmt(left);
        if (left <= 0) stopRec();
      }, 1000);
    };

    function stopRec() {
      clearInterval(tick);
      if (recorder && recorder.state !== 'inactive') recorder.stop();
      $('stop').style.display = 'none';
    }
    $('stop').onclick = stopRec;

    $('again').onclick = () => resetToStart('');

    $('send').onclick = () => {
      $('send').disabled = true;
      $('again').style.display = 'none';
      setStatus('sending');
      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64 = reader.result.split(',')[1];
        try {
          const res = await fetch(APP_URL, {
            method: 'POST',
            body: JSON.stringify({ audio: base64, mimeType: mime, guestName: $('name').value })
          });
          const out = await res.json();
          if (!out.ok) throw new Error(out.error || 'save failed');
          setStatus('thanks');
          $('player').style.display = 'none';
          $('send').style.display = 'none';
          $('send').disabled = false;
          $('rec').style.display = 'inline-block';
          recordedOnce = true;
          $('rec').textContent = t('recAgain');
          $('timer').textContent = fmt(MAX_SECONDS);
        } catch (err) {
          setStatus('error');
          $('send').disabled = false;
          $('again').style.display = 'inline-block';
        }
      };
      reader.readAsDataURL(blob);
    };

    applyLang();
  </script>
</body>
</html>
